# AGC developer configuration.
# Keep this file ordered from "most likely to change" to "rarely changed".
# Use local.properties only for private machine-specific overrides you do not want to commit.

# 1. Local Starsector install.
# Gradle still checks -PstarsectorDir, STARSECTOR_DIRECTORY, and local.properties first.
# These fallback paths are checked in order and the first existing path is used.
starsector.defaultDirs=~/games/starsector,C:/Games/Starsector,C:/Program Files (x86)/Fractal Softworks/Starsector

# 2. Version and release target.
mod.version=2.0.0
repo.owner=DesperatePeter
repo.name=starsector-advanced-weapon-control
# Leave blank to use mod.version as the release tag.
repo.releaseTag=

# 3. Mod identity and generated metadata.
mod.id=advanced_gunnery_control_dbeaa06e
mod.name=Advanced Gunnery Control
mod.author=DesperatePeter, Shattersphere
mod.gameVersion=0.98a
mod.threadId=21280
mod.plugin=com.dp.advancedgunnerycontrol.WeaponControlBasePlugin
mod.utility=true
mod.description=A mod that allows fine-tuning of autofire. Press J-key in combat or on the campaign map to access.

# 4. Build output.
output.jarRoot=jars/agc/AdvancedGunneryControl

# 5. Local build dependency mod resolution.
# Folder names are checked first, then version-suffixed folders, then mod_info.json ids.
dependency.lazyLib.displayName=LazyLib
dependency.lazyLib.folderNames=LazyLib
dependency.lazyLib.modIds=lw_lazylib

dependency.magicLib.displayName=MagicLib
dependency.magicLib.folderNames=MagicLib
dependency.magicLib.modIds=MagicLib

dependency.lunaLib.displayName=LunaLib
dependency.lunaLib.folderNames=LunaLib
dependency.lunaLib.modIds=lunalib

dependency.consoleCommands.displayName=Console Commands
dependency.consoleCommands.folderNames=Console Commands,ConsoleCommands
dependency.consoleCommands.modIds=lw_console
